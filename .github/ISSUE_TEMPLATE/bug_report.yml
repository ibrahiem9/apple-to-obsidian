name: Bug report
description: Report a reproducible problem with sanitized details.
body:
  - type: markdown
    attributes:
      value: |
        Please use invented notes or generated audio to reproduce the problem.
        Do not attach personal notes, audio, transcripts, configuration, Apple library files, or diagnostic payloads.
  - type: input
    id: version
    attributes:
      label: Project commit or tag
      description: Use git rev-parse --short HEAD in the source checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac chip, Node version, and Swift version.
      placeholder: macOS 26.x, Apple Silicon, Node 24.x, Swift 6.2.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and result
      description: What did you run, what did you expect, and what happened? Use synthetic examples and replace local paths.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error
      description: Include only the relevant excerpt. Remove names, paths, note titles, identifiers, and credentials. Do not paste full logs.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed personal content and configuration.
          required: true
